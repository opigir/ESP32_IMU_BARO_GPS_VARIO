[env:m5stack-atom]
platform = espressif32
board = m5stack-atom
framework = arduino

; M5Stack Atom Lite configuration
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv

upload_speed = 1500000
monitor_speed = 115200
build_type = release
monitor_filters = esp32_exception_decoder

build_flags = 
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_WARN
    -DATOM_LITE_BUILD
    -Os
    -DBOARD_HAS_PSRAM=0
    -DARDUINOJSON_USE_LONG_LONG=0
    -DARDUINOJSON_USE_DOUBLE=0

lib_deps = 
    Wire
    BluetoothSerial
    fastled/FastLED@^3.6.0
    WiFi
    WebServer
    bblanchon/ArduinoJson@^6.21.3

build_src_filter = 
    +<*>
    -<bt/>
    -<drv/>
    -<nv/>
    -<sensor/bmp388.cpp>
    +<sensor/gps.cpp>
    -<sensor/madc.cpp>
    -<sensor/mpu9250.cpp>
    -<sensor/ms5611.cpp>
    +<sensor/ringbuf.cpp>
    +<sensor/imu.cpp>
    +<sensor/kalmanfilter4d.cpp>
    +<sensor/mpu6050.cpp>
    +<sensor/ms5611_i2c.cpp>
    -<ui/>
    -<wifi/>
    -<main-old.cpp>
    -<test_mpu6050.cpp>

[env:test-mpu6050]
platform = espressif32
board = m5stack-atom
framework = arduino

; M5Stack Atom Lite configuration  
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

upload_speed = 1500000
monitor_speed = 115200
build_type = debug
monitor_filters = esp32_exception_decoder

build_flags = 
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    -DATOM_LITE_BUILD

lib_deps = 
    Wire
    fastled/FastLED@^3.6.0

build_src_filter = 
    +<*>
    -<bt/>
    -<drv/>
    -<nv/>
    -<sensor/bmp388.cpp>
    -<sensor/gps.cpp>
    -<sensor/imu.cpp>
    -<sensor/kalmanfilter4d.cpp>
    -<sensor/madc.cpp>
    -<sensor/mpu9250.cpp>
    -<sensor/ms5611.cpp>
    -<sensor/ms5611_i2c.cpp>
    -<sensor/ringbuf.cpp>
    +<sensor/mpu6050.cpp>
    -<ui/>
    -<wifi/>
    -<main.cpp>
    -<main-old.cpp>
    +<test_mpu6050.cpp>